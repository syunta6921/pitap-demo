<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>SPORTS LINK｜メニュー</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; background: #f4f4f0; color: #161616; min-height: 100dvh; display: flex; flex-direction: column; }
  .wrap { flex: 1; width: 100%; max-width: 480px; margin: 0 auto; padding: 34px 20px 30px; display: flex; flex-direction: column; }
  .brand { text-align: center; margin-bottom: 8px; }
  .brand .logo { font-size: 27px; font-weight: 900; letter-spacing: .06em; }
  .brand .logo .lime { background: #c8f542; padding: 0 6px; border-radius: 4px; }
  .brand p { font-size: 12.5px; color: #777; margin-top: 6px; font-weight: 700; letter-spacing: .08em; }
  .menu { margin-top: 30px; display: flex; flex-direction: column; gap: 14px; }
  a.card { display: flex; align-items: center; gap: 14px; background: #fff; border: 2px solid #161616; border-radius: 16px; padding: 20px 18px; text-decoration: none; color: #161616; box-shadow: 0 4px 0 #161616; transition: transform .06s ease, box-shadow .06s ease; }
  a.card:active { transform: translateY(3px); box-shadow: 0 1px 0 #161616; }
  a.card .ic { width: 50px; height: 50px; flex: none; border-radius: 14px; display: flex; align-items: center; justify-content: center; background: #161616; }
  a.card .ic.lime { background: #c8f542; }
  a.card .ic.pink { background: #fbe9f5; }
  a.card .tx { flex: 1; }
  a.card .tx b { display: block; font-size: 18px; font-weight: 900; }
  a.card .tx span { display: block; font-size: 12px; color: #888; margin-top: 2px; font-weight: 700; }
  a.card .arw { font-size: 22px; font-weight: 900; color: #bbb; }
  .foot { text-align: center; font-size: 11px; color: #aaa; padding: 18px 0 6px; font-weight: 700; letter-spacing: .1em; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="logo">SPORTS <span class="lime">LINK</span></div>
    <p>スポーツで人と人をつなぐ</p>
  </div>

  <nav class="menu">
    <a class="card" href="https://sports-link-syunta.netlify.app/">
      <span class="ic lime">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#161616" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.7 2.6 4 5.6 4 9s-1.3 6.4-4 9c-2.7-2.6-4-5.6-4-9s1.3-6.4 4-9z"/></svg>
      </span>
      <span class="tx"><b>公式サイト</b><span>SPORTS LINKのホームページ</span></span>
      <span class="arw">›</span>
    </a>

    <a class="card" href="https://www.instagram.com/sports_link0921/">
      <span class="ic pink">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#d6249f" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.4" cy="6.6" r="1.3" fill="#d6249f" stroke="none"/></svg>
      </span>
      <span class="tx"><b>Instagram</b><span>@sports_link0921・最新情報と申込</span></span>
      <span class="arw">›</span>
    </a>

    <a class="card" href="https://syunta6921.github.io/pitap-demo/reception/">
      <span class="ic">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#c8f542" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4.5V3h6v1.5M9 12l2 2 4-4"/></svg>
      </span>
      <span class="tx"><b>当日の受付</b><span>アジリティスクール受付ボード</span></span>
      <span class="arw">›</span>
    </a>
  </nav>

  <div class="foot">SPORTS LINK</div>
</div>
</body>
</html>
